name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# CI for the lightweight rebuild. Gates the new `server/` (Rust) and `web/`
# (React) trees plus a repo-wide `standards` job (Markdown line limit, .claude
# index-sync, agent/skill frontmatter, atomic-design barrels). The legacy
# `backend/` + `frontend/` reference code is intentionally not built or linted
# here; it is removed at cutover (Phase 7). Branch protection should require the
# `server`, `web`, and `standards` checks to pass.

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: server (rust)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test
      - name: Build
        run: cargo build --release

  web:
    name: web (react)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Format check
        run: npm run format:check
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  standards:
    name: standards (repo lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Repo standards (md<150, index-sync, frontmatter, barrels)
        run: node scripts/lint/repo-lint.mjs
