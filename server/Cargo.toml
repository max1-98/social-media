[package]
name = "server"
version = "0.1.0"
edition = "2021"
description = "Lightweight single-binary backend for the sports social network (Axum). Serves the JSON API, static frontend, and media proxy from one process."
license = "UNLICENSED"
publish = false

[dependencies]
axum = { version = "0.7", features = ["multipart"] }
axum-extra = { version = "0.9", features = ["cookie"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["fs", "trace"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Phase 3 — persistence + identity layer. SQLite via sqlx (compile-time checked
# queries; an `.sqlx` offline cache keeps CI buildable without a live DB), argon2
# password hashing, and an in-house OAuth2-style DB-backed token model. Email goes
# out over HTTPS to Resend via reqwest (rustls, no native TLS).
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "sqlite",
    "macros",
    "migrate",
    "time",
] }
argon2 = "0.5"
rand = "0.8"
time = { version = "0.3", features = ["serde", "formatting", "parsing", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }

# Public-id obfuscation. Internal PKs stay sequential `i64`; Sqids encodes them
# into short opaque strings at the API edge so the raw, enumerable id never leaks
# to clients (privacy hardening — see `src/id.rs`). Tiny, pure-logic, no deps.
sqids = "0.4"

# Phase 4 — media signed-URL HMAC. Tiny, no-default-feature crates used to sign
# expiring media URLs for LocalDiskStorage (R2 SigV4 lands at deploy, Phase 7).
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[profile.release]
# Optimize for the small fixed-price EU VM target: prioritise a tiny binary /
# low RSS over raw throughput.
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
