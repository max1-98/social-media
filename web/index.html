<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sports Social</title>

    <!--
      Consent Mode v2 bootstrap (GDPR — .claude/rules/gdpr.md).
      Defines gtag + sets EVERY consent signal to "denied" BEFORE any
      ad/analytics script. The AdSense tag and the Google certified CMP are
      NOT loaded here; ConsentContext injects them from JS only after the user
      accepts, then pushes gtag("consent","update",{...:"granted"}).
    -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      window.gtag = gtag;
      gtag("consent", "default", {
        ad_storage: "denied",
        ad_user_data: "denied",
        ad_personalization: "denied",
        analytics_storage: "denied",
        wait_for_update: 500,
      });
    </script>
    <!--
      Colour-scheme bootstrap (no network — GDPR-clean). Stamps the active
      light/dark scheme on <html> before first paint to avoid a flash, using the
      same storage key + attribute MUI's ThemeProvider (defaultMode="system")
      reads. Keep these names in sync with the theme (see the `theming` skill).
    -->
    <script>
      (function () {
        try {
          var mode = localStorage.getItem("mui-mode") || "system";
          var scheme =
            mode === "system"
              ? window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light"
              : mode;
          document.documentElement.setAttribute("data-mui-color-scheme", scheme);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
